<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Danh sách khách hàng')}"></head>
<body th:replace="~{layout :: shell('Quản lý khách hàng', ~{::#page})}">
<div id="page">

    <div class="card">
        <div class="card-header">
            <h3><i class="bi bi-people text-primary"></i> Khách hàng <span class="badge badge-muted" th:text="'(' + ${totalElements} + ')'"></span></h3>
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <form th:action="@{/customers}" method="get" class="d-flex gap-2">
                    <div class="position-relative">
                        <i class="bi bi-search position-absolute top-50 translate-middle-y text-muted" style="left:12px;"></i>
                        <input type="text" name="keyword" class="form-control ps-5" placeholder="Tìm theo tên hoặc SĐT..."
                               th:value="${keyword}"/>
                    </div>
                    <button type="submit" class="btn btn-outline">Tìm</button>
                </form>
                <a th:href="@{/customers/new}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Khách hàng mới</a>
            </div>
        </div>
        <div class="card-body table-wrap">
            <table class="table table-hover align-middle data-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Số điện thoại</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th class="text-center">Số thiết bị</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td th:text="${c.id}">1</td>
                    <td><strong th:text="${c.fullName}">Tên</strong></td>
                    <td>
                        <span class="badge badge-muted"><i class="bi bi-telephone me-1"></i><span th:text="${c.phone}">SĐT</span></span>
                    </td>
                    <td th:text="${c.email} ?: '-'">Email</td>
                    <td th:text="${c.address} ?: '-'">Địa chỉ</td>
                    <td class="text-center"><span class="badge badge-primary" th:text="${c.deviceCount}">0</span></td>
                    <td class="text-end">
                        <div class="d-flex gap-1 justify-content-end flex-wrap">
                            <a th:href="@{/customers/{id}(id=${c.id})}" class="btn btn-sm btn-outline" title="Chi tiết"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/customers/edit/{id}(id=${c.id})}" class="btn btn-sm btn-secondary" title="Sửa"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/customers/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger" title="Xóa"
                               onclick="return confirm('Xóa khách hàng này?')"><i class="bi bi-trash"></i></a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${customers.isEmpty()}">
                    <td colspan="7" class="empty"><i class="bi bi-inbox d-block fs-3 mb-2"></i>Chưa có khách hàng nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${totalPages > 1}" class="card-footer d-flex justify-content-center">
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" title="Trang đầu"
                           th:href="@{/customers(page=0, keyword=${keyword})}">
                            <i class="bi bi-chevron-double-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" title="Trang trước"
                           th:href="@{/customers(page=${currentPage - 1}, keyword=${keyword})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="p : ${pages}"
                        th:classappend="${!p.ellipsis && p.page == currentPage} ? 'active'">
                        <a th:if="${!p.ellipsis}" class="page-link" th:text="${p.page + 1}"
                           th:href="@{/customers(page=${p.page}, keyword=${keyword})}">1</a>
                        <span th:if="${p.ellipsis}" class="page-link disabled">...</span>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" title="Trang sau"
                           th:href="@{/customers(page=${currentPage + 1}, keyword=${keyword})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" title="Trang cuối"
                           th:href="@{/customers(page=${totalPages - 1}, keyword=${keyword})}">
                            <i class="bi bi-chevron-double-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>
</body>
</html>
