<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' - TechCare Center'">TechCare Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body th:fragment="shell(title, content)">
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo"><i class="bi bi-tools"></i></div>
            <div class="brand-text">
                <h1>TechCare</h1>
                <span>Trung tâm bảo hành &amp; sửa chữa</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <span class="nav-label">Quản lý</span>
            <a th:href="@{/dashboard}" class="side-link" th:classappend="${page == 'dashboard'} ? 'active'">
                <i class="bi bi-speedometer2"></i><span>Tổng quan</span>
            </a>
            <a th:href="@{/customers}" class="side-link" th:classappend="${page == 'customers'} ? 'active'">
                <i class="bi bi-people"></i><span>Khách hàng</span>
            </a>
            <a th:href="@{/devices}" class="side-link" th:classappend="${page == 'devices'} ? 'active'">
                <i class="bi bi-device-ssd"></i><span>Thiết bị</span>
            </a>
            <a th:href="@{/orders}" class="side-link" th:classappend="${page == 'orders'} ? 'active'">
                <i class="bi bi-clipboard2-pulse"></i><span>Phiếu sửa chữa</span>
            </a>
            <a th:href="@{/parts}" class="side-link" th:classappend="${page == 'parts'} ? 'active'">
                <i class="bi bi-box-seam"></i><span>Kho linh kiện</span>
            </a>
            <a th:href="@{/reports}" class="side-link" th:classappend="${page == 'reports'} ? 'active'">
                <i class="bi bi-graph-up-arrow"></i><span>Báo cáo</span>
            </a>
            <span class="nav-label" sec:authorize="hasRole('ADMIN')">Hệ thống</span>
            <a th:href="@{/audit}" class="side-link" sec:authorize="hasRole('ADMIN')"
               th:classappend="${page == 'audit'} ? 'active'">
                <i class="bi bi-clock-history"></i><span>Nhật ký</span>
            </a>
            <a th:href="@{/users}" class="side-link" sec:authorize="hasRole('ADMIN')"
               th:classappend="${page == 'users'} ? 'active'">
                <i class="bi bi-person-gear"></i><span>Quản lý tài khoản</span>
            </a>
            <a th:href="@{/profile}" class="side-link" th:classappend="${page == 'profile'} ? 'active'">
                <i class="bi bi-person-circle"></i><span>Hồ sơ của tôi</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="avatar" th:text="${currentUser != null ? #strings.substring(currentUser.fullName, 0, 1) : '?'}">
                ?
            </div>
            <div class="avatar-info">
                <strong th:text="${currentUser != null} ? ${currentUser.fullName} : ''">Người dùng</strong>
                <small th:text="${currentUser != null} ? ${currentUser.role.label} : ''">Vai trò</small>
            </div>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn-logout" title="Đăng xuất"><i class="bi bi-box-arrow-right"></i></button>
            </form>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <h2 th:text="${title}">Trang</h2>
            <div class="d-flex align-items-center gap-3">
                <span class="topbar-date" th:text="${#temporals.format(today, 'EEEE, dd/MM/yyyy')}">Hôm nay</span>
                <span th:if="${currentUser != null}" class="topbar-user"
                      th:text="'Xin chào, ' + ${currentUser.fullName}">Xin chào</span>
            </div>
        </header>
        <main class="content">
            <th:block th:if="${success}">
                <div class="alert alert-success alert-dismissible fade show d-flex justify-content-between align-items-center" role="alert">
                    <span><i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
                </div>
            </th:block>
            <th:block th:if="${error}">
                <div class="alert alert-danger alert-dismissible fade show d-flex justify-content-between align-items-center" role="alert">
                    <span><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
                </div>
            </th:block>
            <th:block th:replace="${content}"/>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(function () {
        document.querySelectorAll('.alert.alert-success').forEach(function (el) {
            var bs = bootstrap.Alert.getOrCreateInstance(el);
            bs.close();
        });
    }, 5000);
</script>
</body>
</html>
