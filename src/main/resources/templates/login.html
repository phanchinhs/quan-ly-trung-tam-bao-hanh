<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Đăng nhập')}"></head>
<body class="login-page">
<div class="login-box">
    <div class="login-logo">
        <div class="brand-logo"><i class="bi bi-tools"></i></div>
        <div>
            <h1>TechCare Center</h1>
            <small>Trung tâm bảo hành &amp; sửa chữa thiết bị điện tử</small>
        </div>
    </div>
    <h2><i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập hệ thống</h2>

    <div class="login-error" th:if="${param.error}"><i class="bi bi-x-circle me-1"></i>Tên đăng nhập hoặc mật khẩu không đúng.</div>
    <div class="login-error" th:if="${param.logout}"><i class="bi bi-check-circle me-1"></i>Bạn đã đăng xuất thành công.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" name="username" class="form-control" placeholder="VD: admin" required autofocus/>
            </div>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-primary login-submit">Đăng nhập</button>
    </form>

    <div class="login-hint">
        <strong>Tài khoản mặc định (lần chạy đầu tiên):</strong><br/>
        - Quản trị viên: <code>admin / admin123</code><br/>
        - Nhân viên: <code>staff / staff123</code>
    </div>

    <div class="login-hint" style="text-align:center;">
        <a th:href="@{/track}" class="btn btn-outline"><i class="bi bi-search me-1"></i>Tra cứu trạng thái phiếu</a>
    </div>
</div>
</body>
</html>
