spring.application.name=btl-center
server.port=8080

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/btl_center?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===== Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Email (thay thông tin SMTP thật để gửi email) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.from=no-reply@btl-center.local

# ===== MẶC ĐỊNH MUỐN CHẠY DEMO KHÔNG CẦN SMTP: đặt false =====
app.email.enabled=false

# ===== Mã hóa dữ liệu nhạy cảm (AES/GCM) =====
# Khóa bí mật dùng để mã hóa SĐT/email/địa chỉ khách hàng khi lưu vào DB.
# PHẢI đổi sang giá trị riêng của bạn; tối thiểu 16 ký tự.
# Đổi key thì dữ liệu cũ không giải mã được -> nên giữ cố định khi đã đưa vào sản xuất.
app.crypto.secret=BTL-TrungTamBaoHanh-2026-SecretKey